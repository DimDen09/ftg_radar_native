name: ftg_radar_native
description: Native background location radar service for Food Truck Galaxy.
version: 1.1.0
homepage: https://foodtruckgalaxy.be
repository: https://github.com/DimDen09/ftg_radar_native
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.foodtruckgalaxy.ftg_radar_native
        pluginClass: FtgRadarNativePlugin

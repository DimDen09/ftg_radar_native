name: ftg_radar_native
description: Native Android background radar service for Food Truck Galaxy.
version: 1.0.0
homepage: https://foodtruckgalaxy.be

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.foodtruckgalaxy.ftg_radar_native
        pluginClass: FtgRadarNativePlugin
